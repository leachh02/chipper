# Self-hosted Chipper. Start it with: docker compose up -d
# Then open http://<this machine>:8080 and create the admin account.
#
# To also group your backlog by topic, start it with the AI service:
#   docker compose --profile ai up -d
services:
  chipper:
    # Spotify is set up from apps/frontend/.env, as for npm run dev.
    # See SELF_HOSTING.md.
    build: .
    container_name: chipper
    ports:
      - "8080:8080"
    volumes:
      # The database: everyone's accounts and synced data
      - chipper-data:/data
    environment:
      # Grouping by topic is offered only while this answers, so it's
      # harmless without the ai profile
      CHIPPER_AI_URL: http://chipper-ai:8000
    restart: unless-stopped

  chipper-ai:
    profiles: [ai]
    build: apps/ai
    container_name: chipper-ai
    # Only the Chipper server talks to it, so no ports are published
    restart: unless-stopped

volumes:
  chipper-data:
