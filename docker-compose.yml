# Self-hosted Chipper. Start it with: docker compose up -d
# Then open http://<this machine>:8080 and create the admin account.
services:
  chipper:
    # Spotify is set up from apps/frontend/.env, as for npm run dev.
    # See SELF_HOSTING.md.
    build: .
    container_name: chipper
    ports:
      - "8080:8080"
    volumes:
      # The database: everyone's accounts and synced data
      - chipper-data:/data
    restart: unless-stopped

volumes:
  chipper-data:
