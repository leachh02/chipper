name: Publish images

# Publishes the self-hosted server's images, so running Chipper needs only
# docker-compose.yml and .env (see SELF_HOSTING.md):
#   ghcr.io/leachh02/chipper      the app, accounts and sync
#   ghcr.io/leachh02/chipper-ai   the optional group-by-topic service
# main is published as :latest, and a v1.2.3 tag as :1.2.3 and :1.2
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push replaces a waiting publish of the same branch or tag
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: chipper
            context: .
          - image: chipper-ai
            context: apps/ai
    steps:
      - uses: actions/checkout@v4
      # For arm64 (a Raspberry Pi, say) as well as amd64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
