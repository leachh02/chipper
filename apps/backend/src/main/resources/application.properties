# === SERVER CONFIG ===
server.port=8080
spring.application.name=backend

# === OAUTH2 CLIENT CONFIG (Google) ===
google.redirect.uri=http://localhost:8080/api/auth/google/callback
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/youtube.readonly

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# === FRONTEND REDIRECT AFTER LOGIN ===
spring.security.oauth2.client.client-name=google
# Optional: send user back to your React app after login
spring.security.oauth2.client.login-success-url=http://localhost:5173/dashboard

# === POSTGRESQL CONFIG ===
spring.datasource.url=jdbc:postgresql://localhost:5432/chipper
spring.datasource.username=chipper_user
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect