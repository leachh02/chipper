spring.application.name=chipper-server
server.port=${PORT:8080}

# One SQLite file in the data directory. A single connection keeps writes in
# order; SQLite is plenty fast for a household's backlogs.
chipper.data-dir=${CHIPPER_DATA_DIR:data}
spring.datasource.url=jdbc:sqlite:${chipper.data-dir}/chipper.db?foreign_keys=on&journal_mode=WAL&busy_timeout=10000
spring.datasource.hikari.maximum-pool-size=1

# Where the built Chipper app lives. The Docker image bundles it in the jar.
chipper.app-dir=${CHIPPER_APP_DIR:classpath:/static/}

# A first sync uploads a whole backlog in one request
server.tomcat.max-swallow-size=50MB
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false
